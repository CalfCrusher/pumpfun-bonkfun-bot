# SAFE TEST VERSION - Ultra-Fast Sniper
# Use this for your FIRST test run with minimal risk
# After successful test, switch to bot-ultra-sniper-aggressive.yaml

name: "bot-ultra-sniper-TEST"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: false # Disabled after testing; switch to aggressive bot for live run
separate_process: false # Run in foreground with live output

platform: "pump_fun"

geyser:
  endpoint: "${GEYSER_ENDPOINT}"
  api_token: "${GEYSER_API_TOKEN}"
  auth_type: "x-token"

# Trading parameters - SAFE TEST AMOUNTS
trade:
  buy_amount: 0.006 # Test amount (~$1.20)
  buy_slippage: 0.3
  sell_slippage: 0.3

  exit_strategy: "tp_sl"
  take_profit_percentage: 0.5 # +50% profit
  stop_loss_percentage: 0.3 # -30% loss
  max_hold_time: 5 # 5 seconds max hold
  price_check_interval: 1 # Check every 1 second
  # Debounce safeguards to avoid instant stop-loss on noisy first sample
  min_hold_before_stop_seconds: 3
  stop_loss_confirmations: 2

  extreme_fast_mode: true
  extreme_fast_token_amount: 100

priority_fees:
  enable_dynamic: false
  enable_fixed: true
  fixed_amount: 500_000
  extra_percentage: 0.0
  hard_cap: 1_000_000

compute_units:
  account_data_size: 512_000

filters:
  match_string: null
  bro_address: null
  listener_type: "logs"
  max_token_age: 0.001
  marry_mode: false
  yolo_mode: false # ⚠️ TEST MODE: Only ONE token then stop!
  
  # Liquidity filtering
  min_real_liquidity_sol: 15.0   # Minimum REAL SOL liquidity to buy (preferred)
  min_market_cap_sol: 15.0       # Legacy/backup key; ignored if min_real_liquidity_sol is set
  wait_before_buy: 5              # Wait N seconds after detection to check liquidity (faster; still stabilizes)

retries:
  max_attempts: 1
  wait_after_creation: 0
  wait_after_buy: 5
  wait_before_new_token: 2

cleanup:
  mode: "post_session"
  force_close_with_burn: false
  with_priority_fee: false

node:
  max_rps: 25
