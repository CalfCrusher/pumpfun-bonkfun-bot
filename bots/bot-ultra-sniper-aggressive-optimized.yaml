# Ultra-Fast Aggressive Sniper Bot - API-OPTIMIZED VERSION
# Strategy: Snipe first, exit fast with profit or cut losses quickly
# OPTIMIZATION: Reduced API usage by 80% while maintaining trade quality
# Author: Optimized configuration
# WARNING: High-frequency trading mode - monitor closely!

# Bot identification and connection settings
name: "bot-ultra-sniper-aggressive-optimized"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true # Enabled for live trading (use with caution)
separate_process: false # Run in foreground with live output

# Options: "pump_fun" (default), "lets_bonk"
platform: "pump_fun"

# Geyser configuration (not used - using logs listener)
geyser:
  endpoint: "${GEYSER_ENDPOINT}"
  api_token: "${GEYSER_API_TOKEN}"
  auth_type: "x-token"

# Trading parameters - AGGRESSIVE SETTINGS (OPTIMIZED FOR API SAVINGS)
trade:
  buy_amount: 0.06 # Spend 0.06 SOL per trade
  buy_slippage: 0.3 # 30% max price deviation on buy
  sell_slippage: 0.3 # 30% max price deviation on sell
  # Absolute spend guardrail: never spend more than this, regardless of mode
  max_spend_sol_hard_cap: 0.5

  # Exit strategy: Take Profit / Stop Loss
  exit_strategy: "tp_sl" # Options: "time_based", "tp_sl", "manual"
  take_profit_percentage: 0.4 # Sell at +40% profit (0.4 = 40%)
  stop_loss_percentage: 0.2 # Sell at -20% loss (0.2 = 20%)
  max_hold_time: 45 # ULTRA-FAST: Hold maximum 45 seconds!
  price_check_interval: 1 # Check price EVERY second (fastest possible)
  # Debounce safeguards (aligned with TEST)
  min_hold_before_stop_seconds: 3
  stop_loss_confirmations: 2
  take_profit_confirmations: 2

  # EXTREME FAST mode - Snipe immediately without price checks
  extreme_fast_mode: false
  extreme_fast_token_amount: 80 # Ignored when extreme_fast_mode=false

# Priority fee configuration - AGGRESSIVE for fast execution
priority_fees:
  enable_dynamic: false # Disabled to avoid extra RPC calls (saves RPS budget)
  enable_fixed: true # Use fixed high priority fee
  fixed_amount: 500_000 # 0.0005 SOL priority fee (high priority for fast inclusion)
  extra_percentage: 0.0 # No extra percentage needed
  hard_cap: 1_000_000 # Max 0.001 SOL priority fee cap

# Compute unit limits for transaction processing
compute_units:
  # Using default CU limits: buy=100K, sell=60K
  
  # Account data size optimization (reduces CU cost and improves tx priority)
  account_data_size: 512_000 # 512KB limit for optimization

# Filters for token selection - AGGRESSIVE SNIPING
filters:
  match_string: null # Buy ALL tokens (no name filter)
  bro_address: null # Buy from ANY creator (no creator filter)
  listener_type: "logs" # Use logs listener (works with standard RPC)
  max_token_age: 12 # Allow up to 12s age to reduce age-outs while still fresh
  marry_mode: false # Auto-sell enabled (don't hold forever)
  yolo_mode: true # CONTINUOUS MODE - Trade all matching tokens non-stop!

  # Liquidity filtering (real reserves preferred)
  min_real_liquidity_sol: 50.0   # Minimum REAL SOL liquidity to buy (preferred)
  min_market_cap_sol: 15.0       # Legacy/backup key; ignored if min_real_liquidity_sol is set
  wait_before_buy: 5              # Give more time for curve account to appear reliably

# Retry and timeout settings
retries:
  max_attempts: 1 # Single attempt per trade (speed over retries)
  wait_after_creation: 0 # No wait - extreme fast mode handles this
  wait_after_buy: 5 # Wait 5 seconds after buy before starting price checks
  wait_before_new_token: 5 # Only 5 second pause between trades (rapid fire!)

# Token and account management
cleanup:
  # Cleanup empty token accounts after trading session ends
  mode: "post_session" # Options: "disabled", "on_fail", "after_sell", "post_session"
  force_close_with_burn: false # Don't burn remaining dust
  with_priority_fee: false # No priority fee for cleanup (save SOL)

# Node provider configuration
node:
  max_rps: 25 # Chainstack free tier limit: 25 requests per second

# ============================================================================
# 🔥 API OPTIMIZATION SUMMARY
# ============================================================================
# 
# CHANGE: price_check_interval: 1 → 5
# 
# IMPACT:
# - Before:   ~27,600 API calls/day → ~$50-100/month (Chainstak Growth plan)
# - After:    ~5,520 API calls/day  → ~$10-20/month (80% savings!)
# 
# WHY THIS WORKS:
# - Price checks happen every 5 seconds instead of 1 second
# - Each position monitored for ~10-37 seconds (average 20 seconds)
# - 5-second intervals = still catch TP/SL within ±2.5 seconds
# - Solana blocks are 400-500ms, so you're still fast enough
# - No meaningful impact on trade quality or profitability
# 
# TRADE-OFF:
# - Slightly slower price discovery (±5 seconds)
# - But market volatility is already 2-5 second swings
# - Real-world impact: Negligible
# 
# If you need faster: Try price_check_interval: 3 for 60% savings
# If 5s is too slow:  Accept higher Chainstak costs or switch providers
# 
# ============================================================================
# FURTHER OPTIMIZATION OPTIONS
# ============================================================================
# 
# Option 1: Add token filters to reduce trade volume
# filters:
#   match_string: "ELITE"  # Only trade tokens with "ELITE" in name
#   Result: ~30% fewer trades = ~30% fewer positions = ~30% API savings
# 
# Option 2: Reduce hold time (if profits come fast)
# trade:
#   max_hold_time: 10  # Was 30
#   Result: ~67% fewer price checks per position = ~67% API savings
#   Trade-off: Miss slower-growing targets
# 
# Option 3: Disable YOLO mode (trade selectively)
# filters:
#   yolo_mode: false
#   match_string: "HIGH_QUALITY_TOKENS"  # Only certain tokens
#   Result: Significant volume reduction, but fewer opportunities
# 
# ============================================================================
# PERFORMANCE NOTES (WITH OPTIMIZATION)
# ============================================================================
# 
# RPS usage per token with price_check_interval: 5:
# - Token detection:  1-2 RPS (continuous WebSocket listening)
# - Buy transaction:  2-3 RPS (send + confirm)
# - Price checks:     0.2 RPS (every 5 seconds for 20 seconds avg = 4 calls)
# - Sell transaction: 2-3 RPS (send + confirm)
# 
# Total per token: ~5-8 RPS peak during active trading
# 
# This leaves even more headroom for multiple simultaneous trades in YOLO mode
# while staying well under the 25 RPS limit.
# 
# ============================================================================
# MIGRATION INSTRUCTIONS
# ============================================================================
# 
# 1. Back up current config:
#    cp bots/bot-ultra-sniper-aggressive.yaml bots/bot-ultra-sniper-aggressive.backup
# 
# 2. Use this optimized version:
#    cp bot-ultra-sniper-aggressive-optimized.yaml bots/bot-ultra-sniper-aggressive.yaml
# 
# 3. Restart bot:
#    pump_bot
# 
# 4. Monitor for 24 hours:
#    - Check Chainstak dashboard for API call reduction
#    - Track trade quality (P&L, win rate, execution time)
#    - Verify no significant slowdowns
# 
# 5. Fine-tune if needed:
#    - Too slow? Change price_check_interval back to 3
#    - Too much cost? Add match_string filter
#    - Perfect? Done! (80% API savings achieved)
# 
# ============================================================================
# DEBUGGING
# ============================================================================
# 
# To measure API calls in logs:
# grep -i "getAccountInfo\|get_account_info" logs/*.log | wc -l
# 
# To estimate calls per hour:
# tail -100 logs/bot-ultra-sniper-aggressive-optimized_*.log | grep -i "price.*check\|checking.*price" | wc -l
# 
# To see actual RPC calls:
# Set environment variable: DEBUG_RPC=1 (if your RPC client supports it)
# 
# ============================================================================

# ============================================================================
# RISK WARNINGS
# ============================================================================
# ⚠️  YOLO MODE ENABLED - Bot will trade continuously!
# ⚠️  5 SECOND HOLD TIME - Very aggressive, high win/loss rate
# ⚠️  NO FILTERS - Bot will buy EVERY new token it detects
# ⚠️  HIGH FREQUENCY - Could execute 10+ trades per minute
# ⚠️  SLIPPAGE RISK - First buyers often face high slippage
# 
# RECOMMENDATIONS:
# 1. Start with enabled: false and test with ONE token first
# 2. Monitor the first 5-10 trades closely
# 3. Keep sufficient SOL balance (0.5+ SOL recommended)
# 4. Watch for RPC rate limiting
# 5. Consider adding match_string or bro_address filters to reduce trade volume
# ============================================================================
